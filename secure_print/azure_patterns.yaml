# Additional patterns for API keys, connection strings, and secrets
sensitive_patterns:
  - pattern: "DefaultEndpointsProtocol=https;AccountName="
    description: "Azure Storage Connection String"
    mask_type: "connection_string"
  - pattern: "Endpoint=sb://"
    description: "Service Bus Connection String"
    mask_type: "connection_string"
  - pattern: "HostName="
    description: "IoT Hub Connection String"
    mask_type: "connection_string"
  - pattern: "AccountKey="
    description: "Storage Account Key"
    mask_type: "key"
  - pattern: "SharedAccessKey="
    description: "Shared Access Key"
    mask_type: "key"
  - pattern: "sig="
    description: "SAS Token Signature"
    mask_type: "token"

# Regex patterns for dynamic matching
regex_patterns:
  # Match any Azure region-based hostname
  - pattern: "\\.[a-z0-9-]+\\.azure\\.com"
    description: "Regional Azure services"
  - pattern: "\\.[a-z0-9-]+\\.windows\\.net"
    description: "Regional Windows services"
  - pattern: "\\.[a-z0-9-]+\\.azure\\.net"
    description: "Regional Azure.net services"
  - pattern: "\\.[a-z0-9-]+\\.azurecr\\.io"
    description: "Regional Container Registry"

# Common Azure resource name patterns
resource_name_patterns:
  - pattern: "/subscriptions/[a-f0-9-]{36}/"
    description: "Azure Subscription ID"
    mask_after: "/subscriptions/"
    reveal_chars: 8
  - pattern: "/resourceGroups/[^/]+/"
    description: "Azure Resource Group"
    mask_after: "/resourceGroups/"
    reveal_chars: 3
